<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Continhas:</h1>
    <main>
        <span>
            <label for="first">Primeiro  número</label> <br>
            <input type="number" name="first" id="first" minlength="1" required>
           
                <select name="mathSignal" id="mathSignal" title="Sinal">
                    <option value="sum">+</option>
                    <option value="subtract">-</option>
                    <option value="multiply">*</option>
                    <option value="divide">/</option>
                </select>
            
            <label for="second">Segundo número</label>
            <br>
            <input type="number" name="second" id="second" minlength="1" required>
        </span>
        <button title="Resultado" id="result">Calcular</button>
    </main>
</body>
</html>
